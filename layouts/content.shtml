<extend template="base.shtml">
<head id="site-head"></head>
<main id="site-content">
<ctx :if="$page.custom.get('kind').eql('article')">
    <header class="article-intro page-width"><p class="eyebrow"><span class="accent-dot"></span> THE ZIG AST LAB</p><h1 :text="$page.title"></h1><p class="intro-description" :text="$page.description"></p></header>
    <article class="article-surface page-width"><div class="prose" :html="$page.content()"></div></article>
</ctx>
<ctx :if="$page.custom.get('kind').eql('article').not()" :html="$page.content()"></ctx>
<ctx :if="$page.custom.get('kind').eql('home')">
  <img class="canopy-roots" src="$site.asset('canopy-roots.webp').link()" width="1800" height="520" alt="" aria-hidden="true">
</ctx>
</main>
